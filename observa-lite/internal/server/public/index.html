<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Observa Lite · Monitoramento</title><style>
:root{color-scheme:dark;--bg:#0c1423;--sidebar:#0d1729;--panel:#142139;--line:#263754;--fg:#eef5ff;--muted:#91a1bb;--blue:#5da8ff;--green:#3ad2a0;--amber:#f5b954;--red:#fa737c;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-size:13px}header,aside,main,section{display:block}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue)}#shell{display:flex;min-height:100vh}aside{width:232px;min-width:232px;background:var(--sidebar);border-right:1px solid var(--line);padding:23px 14px;position:sticky;top:0;height:100vh}.brand{font-size:18px;font-weight:800;letter-spacing:-.5px;padding:4px 11px 30px;display:flex;gap:9px;align-items:center}.mark{width:24px;height:24px;border:3px solid #64b6ff;border-radius:7px;display:inline-block;box-shadow:inset 0 0 0 4px var(--sidebar)}.tiny{font-size:11px;color:var(--muted);font-weight:500}.group-label{text-transform:uppercase;font-size:10px;font-weight:700;letter-spacing:1.5px;color:#7487a6;margin:19px 12px 8px}nav button{width:100%;border:0;background:transparent;color:#b2c2db;text-align:left;padding:11px 13px;border-radius:8px;margin-bottom:3px;display:flex;gap:11px;align-items:center}nav button:hover{background:#1a2a43}nav button.active{background:#1c3452;color:#fff;border-left:3px solid var(--blue);padding-left:10px}nav button span{font-size:17px;width:19px;text-align:center}.aside-footer{position:absolute;bottom:18px;color:var(--muted);left:25px;font-size:11px}main{padding:29px 32px 45px;flex:1;min-width:0;max-width:1700px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.eyebrow{color:var(--blue);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1.6px;margin-bottom:7px}h1{font-size:25px;letter-spacing:-.65px;margin:0 0 5px}p.sub{margin:0;color:var(--muted);font-size:12px}.controls{display:flex;gap:9px;align-items:center}.btn{border:1px solid #3a506f;color:var(--fg);padding:9px 13px;background:#1c2d46;border-radius:8px;font-weight:600}.btn:hover{background:#28405f}.btn.primary{background:#2676cc;border-color:#2676cc}.btn.danger{border-color:#8d4551;color:#ffacb6}.dot{display:inline-block;background:var(--green);height:7px;width:7px;border-radius:99px;margin-right:6px}#content{display:grid;gap:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0}.metric{padding:18px}.metric .label{font-size:11px;color:var(--muted);font-weight:600}.metric strong{display:block;font-size:29px;margin:8px 0 3px;letter-spacing:-1px}.metric .hint{color:#8da5bc;font-size:11px}.cols{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}.card-head{padding:17px 19px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;align-items:center}.card-head h2{font-size:14px;margin:0}.card-body{padding:18px 19px}.card-head small{color:var(--muted)}table{border-collapse:collapse;width:100%;min-width:580px}th,td{text-align:left;padding:12px 16px;border-bottom:1px solid #25334b;vertical-align:middle}th{font-size:10px;color:#90a6c2;text-transform:uppercase;letter-spacing:1px}td{color:#d7e4f6}tr:last-child td{border-bottom:none}.table-wrap{overflow:auto}.status{display:inline-block;padding:4px 8px;border-radius:5px;font-size:11px;font-weight:700;background:#31425b;color:#aab9c7}.status.ok{color:#48dfb2;background:#164c48}.status.critical{color:#ff949a;background:#542d3b}.status.warning,.status.stale{color:#f6c06a;background:#4b3b28}.status.unknown{color:#b6bfcc;background:#394455}.empty{padding:40px 16px;text-align:center;color:var(--muted);line-height:1.7}.mono{font:11px ui-monospace,SFMono-Regular,Consolas,monospace}.graph-area{position:relative;height:500px;overflow:auto;background:radial-gradient(circle at 1px 1px,#26334b 1px,transparent 1px);background-size:24px 24px}.graph-area svg{width:100%;height:100%;min-width:600px}.graph-area .edge{fill:none;stroke:#588cb5;stroke-width:1.8;opacity:.68}.graph-area .node{cursor:pointer}.graph-area .node:hover rect{stroke:#90ccff;stroke-width:2}.detail{background:#172841;border-top:1px solid var(--line);padding:14px 18px;color:#b7cae3}.legend{padding:10px 18px;color:#90a4bf;font-size:11px;border-top:1px solid var(--line)}input,select,textarea{width:100%;border:1px solid #344c6a;background:#0d192a;color:var(--fg);border-radius:7px;padding:10px;margin-top:5px}textarea{min-height:105px;resize:vertical;font-family:ui-monospace,monospace}.field{margin:0 0 14px}.field label{color:#b4c5dc;font-size:11px;font-weight:700}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.notice{padding:13px 15px;border:1px solid #345270;background:#162a41;border-radius:9px;color:#b5cfe6;line-height:1.6}.action-row{display:flex;gap:9px;margin-top:15px;flex-wrap:wrap}.pill{display:inline-block;background:#1a3450;color:#9bc8ff;border:1px solid #294e72;border-radius:99px;padding:3px 10px;font-size:10px}.panel-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.preview-panel{min-height:170px;padding:18px}.preview-panel iframe{width:100%;height:230px;border:1px solid #314760;border-radius:7px;background:white}.preview-panel .value{font-size:38px;font-weight:750;margin-top:30px}.login-screen{position:fixed;inset:0;background:#0a1423ed;display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}.login-screen .card{padding:26px;width:380px;max-width:100%}.login-screen p{color:var(--muted);line-height:1.7}.toast{position:fixed;bottom:24px;right:24px;z-index:99;background:#223d54;border:1px solid #37638b;color:white;padding:12px 17px;border-radius:8px;max-width:420px;box-shadow:0 4px 22px #0008}.incident{border-left:3px solid var(--red);padding:12px 13px;margin-bottom:9px;background:#17263d;border-radius:5px}.incident .meta{color:var(--muted);font-size:11px;padding-top:5px}@media(max-width:1150px){.cols{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){aside{width:63px;min-width:63px;padding:18px 6px}.brand{font-size:0;padding:5px 13px 24px}nav button{font-size:0;justify-content:center;padding:11px 6px}nav button.active{padding-left:3px}.group-label,.aside-footer{display:none}main{padding:22px 15px}.stats{grid-template-columns:repeat(2,1fr)}.grid2,.panel-list{grid-template-columns:1fr}.top{flex-wrap:wrap}.controls{width:100%}}
</style></head><body><div id="shell"><aside><div class="brand"><i class="mark"></i>OBSERVA <span class="tiny">LITE</span></div><nav id="nav"></nav><div class="aside-footer">MVP · 0.1.0<br>Descoberta passiva Linux</div></aside><main><div class="top"><div><div class="eyebrow">Plataforma de observabilidade</div><h1 id="pageTitle">Visão geral</h1><p class="sub" id="subtitle">Inventário, mapas e correlação do ambiente</p></div><div class="controls"><span class="tiny"><span class="dot"></span> Atualização 30 s</span><button class="btn" id="refresh">↻ Atualizar</button><button class="btn" id="logout">Sair</button></div></div><div id="content"></div></main></div><div class="login-screen" id="login"><div class="card"><h1>Conectar ao Observa Lite</h1><p>Informe a chave administrativa criada durante a instalação. A chave permanece apenas nesta sessão do navegador.</p><div class="field"><label>Token de acesso</label><input id="token" type="password" placeholder="OBSERVA_ADMIN_TOKEN"></div><button class="btn primary" id="connect" style="width:100%">Conectar</button><p id="loginerror" style="color:#ff949a"></p></div></div><div id="toast" class="toast" style="display:none"></div><script>
const items=[['overview','▦','Visão geral'],['services','◇','Service Mapping'],['network','⬡','Network Mapping'],['hosts','▤','Hosts e processos'],['templates','▣','Templates'],['sources','⇄','Data Sources'],['dashboards','▥','Dashboards'],['incidents','⚑','Incidentes'],['mcp','✦','MCP / IA']];
let current='overview', snapshot=null, token=sessionStorage.getItem('observa_admin_token')||'';
const el=(tag,cls='',text='')=>{let e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e};
const $=x=>document.getElementById(x), fmt=x=>typeof x==='number'?x.toLocaleString('pt-BR'):x;
function toast(message){const x=$('toast');x.textContent=message;x.style.display='block';setTimeout(()=>x.style.display='none',4500)}
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{'X-API-Key':token,...(opts.body?{'Content-Type':'application/json'}:{}),...(opts.headers||{})}});if(!r.ok)throw Error(`${r.status}: ${await r.text()}`);return await r.json()}
async function refresh(){if(!token){$('login').style.display='flex';return}try{snapshot=await api('/api/v1/snapshot');$('login').style.display='none';render()}catch(e){$('login').style.display='flex';$('loginerror').textContent=e.message}}
function change(page){current=page;render()}
function render(){const n=$('nav');n.replaceChildren();items.forEach(([id,icon,name],i)=>{if(i===0||i===4||i===7)n.append(el('div','group-label',i===0?'Explorar':i===4?'Configuração':'Operação'));const b=el('button',current===id?'active':'');b.append(el('span','',icon),document.createTextNode(name));b.onclick=()=>change(id);n.append(b)});const item=items.find(x=>x[0]===current);$('pageTitle').textContent=item[2];$('subtitle').textContent={overview:'Saúde e inventário observado em tempo quase real',services:'Dependências de aplicações descobertas automaticamente',network:'Conexões IP observadas — não representa topologia física',hosts:'Servidores, runtimes, serviços e processos',templates:'Verificações HTTP e TCP configuráveis',sources:'Consultas a Prometheus e APIs JSON',dashboards:'Painéis configuráveis e HTML Graphics isolado',incidents:'Ocorrências inferidas com evidências',mcp:'Ferramentas MCP de investigação somente leitura'}[current];const c=$('content');c.replaceChildren();if(!snapshot)return;({overview,services:()=>graphScreen('service_map'),network:()=>graphScreen('network_map'),hosts,templates,sources,dashboards,incidents,mcp}[current])()}
function card(title,desc){let wrap=el('section','card'),head=el('div','card-head'),h=el('h2','',title);head.append(h);if(desc)head.append(el('small','',desc));wrap.append(head);return wrap}
function body(parent){let b=el('div','card-body');parent.append(b);return b}
function metric(title,value,hint){let b=el('div','card metric');b.append(el('div','label',title),el('strong','',String(value)),el('div','hint',hint));return b}
function status(x){const a=el('span','status '+(x||'unknown'),x||'unknown');return a}
function table(headers,rows){let holder=el('div','table-wrap'),t=el('table'),tr=el('tr');headers.forEach(h=>tr.append(el('th','',h)));let th=el('thead');th.append(tr);t.append(th);let tb=el('tbody');rows.forEach(cols=>{let tr=el('tr');cols.forEach(col=>{let td=el('td');if(col instanceof Node)td.append(col);else td.textContent=String(col??'—');tr.append(td)});tb.append(tr)});t.append(tb);holder.append(t);return holder}
function overview(){let a=el('div','stats');const h=snapshot.hosts,svc=snapshot.service_map,net=snapshot.network_map,ev=snapshot.events;a.append(metric('Hosts observados',h.length,'Agente Linux'),metric('Serviços descobertos',svc.nodes.filter(x=>x.kind==='service').length,'Por host / processo'),metric('Dependências APM',svc.edges.length,'Sockets TCP observados'),metric('Incidentes ativos',ev.filter(x=>x.status==='open').length,'Template e mudanças detectadas'));$('content').append(a);let cols=el('div','cols');let m=card('Service Mapping','Mapa gerado da coleta passiva');let d=body(m);drawGraph(d,svc,320);let t=card('Monitoramentos','Templates configurados');body(t).append(table(['Template','Tipo','Estado'],snapshot.templates.slice(0,8).map(x=>[x.name,x.kind,status(x.status)])));if(!snapshot.templates.length)body(t).append(el('div','empty','Cadastre verificações HTTP ou TCP em Templates.'));cols.append(m,t);$('content').append(cols);let rec=card('Eventos recentes',`${ev.length} registros`);body(rec).append(table(['Data','Entidade','Resumo','Estado'],ev.slice(-8).reverse().map(e=>[new Date(e.at).toLocaleString('pt-BR'),e.entity,e.summary,status(e.status==='open'?'critical':'ok')])));$('content').append(rec)}
function graphScreen(k){let x=card(k==='service_map'?'Service Mapping — descoberta passiva':'Network Mapping — fluxos IP',`Nós: ${snapshot[k].nodes.length} · Conexões: ${snapshot[k].edges.length}`);drawGraph(x,snapshot[k],500);$('content').append(x);let note=el('div','notice',k==='service_map'?'As arestas indicam comunicações TCP observadas. O nome e a profundidade dos serviços dependem dos processos e dos hosts monitorados. Traces de requisição e protocolos L7 ainda não estão implementados.':'As ligações representam comunicação IP observada pelos hosts monitorados. Não há descoberta física de switches, interfaces ou enlaces SNMP/LLDP nesta versão.');$('content').append(note)}
function drawGraph(parent,graph,height){let area=el('div','graph-area');area.style.height=height+'px';if(graph.nodes.length===0){area.append(el('div','empty','Nenhuma topologia observada. Instale e inicie o agente Linux.'));parent.append(area);return};const w=900,h=Math.max(340,height),svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox',`0 0 ${w} ${h}`);const nodes=graph.nodes.slice(0,80),edges=graph.edges.filter(e=>nodes.some(n=>n.id===e.from)&&nodes.some(n=>n.id===e.to)).slice(0,150);const pos=new Map();let roots=nodes.filter(n=>n.kind==='service'||n.kind==='host');let ext=nodes.filter(n=>!roots.includes(n));const put=(array,xStart,xEnd)=>array.forEach((n,i)=>{let rows=Math.ceil(array.length/Math.max(1,Math.ceil((xEnd-xStart)/156)));let cols=Math.max(1,Math.ceil(array.length/rows));let col=i%cols,row=Math.floor(i/cols);pos.set(n.id,{x:xStart+80+col*Math.max(150,(xEnd-xStart-110)/cols),y:60+row*Math.min(102,(h-90)/Math.max(1,rows))})});put(roots,0,540);put(ext,560,850);function line(tag,attributes){let q=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(attributes).forEach(([k,v])=>q.setAttribute(k,v));return q};let defs=line('defs',{});let marker=line('marker',{id:'arr',viewBox:'0 0 10 10',refX:10,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});marker.append(line('path',{d:'M 0 1 L 10 5 L 0 9 z',fill:'#6992ba'}));defs.append(marker);svg.append(defs);edges.forEach(e=>{let a=pos.get(e.from),b=pos.get(e.to);if(!a||!b)return;let p=line('path',{d:`M${a.x+52} ${a.y+21} Q${(a.x+b.x+52)/2} ${(a.y+b.y)/2-36} ${b.x+52} ${b.y+21}`,class:'edge','marker-end':'url(#arr)'});p.onclick=()=>details(e);svg.append(p)});nodes.forEach(n=>{const p=pos.get(n.id);if(!p)return;let g=line('g',{class:'node',transform:`translate(${p.x},${p.y})`});let rect=line('rect',{width:122,height:46,rx:7,fill:n.kind==='external'||n.kind==='external-host'?'#17273d':'#19364b',stroke:n.status==='stale'?'#a97846':'#417ba8'});g.append(rect);let circle=line('circle',{cx:11,cy:13,r:4,fill:n.status==='ok'?'#39cfa4':'#94a4b8'});g.append(circle);let txt=line('text',{x:20,y:17,fill:'#e6f3ff','font-size':11,'font-weight':600});txt.textContent=n.name.slice(0,18);g.append(txt);let sub=line('text',{x:11,y:34,fill:'#9cb6d1','font-size':9});sub.textContent=(n.host||n.kind).slice(0,24);g.append(sub);g.onclick=()=>details(n);svg.append(g)});area.append(svg);parent.append(area);let detail=el('div','detail','Clique em um nó ou conexão para ver evidências e propriedades.');parent.append(detail);function details(v){detail.textContent=JSON.stringify(v,null,2);detail.style.whiteSpace='pre-wrap'}}
function hosts(){let c=card('Hosts descobertos',`${snapshot.hosts.length} registros`);let b=body(c);if(!snapshot.hosts.length)b.append(el('div','empty','Nenhum agente conectado.'));else b.append(table(['Host','Endereços','Processos','Conexões','Última observação'],snapshot.hosts.map(h=>[h.name,h.addresses.join(', '),h.processes.length,h.connections.length,new Date(h.last_seen).toLocaleString('pt-BR')])));$('content').append(c);let pro=card('Processos monitorados','Agrupados por servidor');body(pro).append(table(['Host','PID','Processo','Serviço','Memória'],snapshot.hosts.flatMap(h=>h.processes.slice(0,250).map(p=>[h.name,p.pid,p.name,p.service,(p.rss_bytes/1024/1024).toFixed(1)+' MB'])).slice(0,400)));$('content').append(pro)}
function field(label,type='text',placeholder='',value=''){const wrap=el('div','field'),lab=el('label','',label),control=type==='textarea'?el('textarea'):el('input');if(type!=='textarea')control.type=type;control.placeholder=placeholder;control.value=value;wrap.append(lab,control);return [wrap,control]}
function selectField(label,opts){let w=el('div','field'),l=el('label','',label),s=el('select');opts.forEach(([v,n])=>{let o=el('option','',n);o.value=v;s.append(o)});w.append(l,s);return [w,s]}
function templates(){let c=card('Novo template','Coleta ativa HTTP/TCP');let b=body(c),grid=el('div','grid2');let [wn,name]=field('Nome','text','API de pagamentos');let [wk,kind]=selectField('Tipo de verificação',[['http','HTTP'],['tcp','TCP']]);let [wt,target]=field('Alvo','text','https://exemplo.com/health ou host:porta');let [wi,interval]=field('Intervalo (segundos)','number','30','30');let [we,expected]=field('HTTP esperado','number','200','200');grid.append(wn,wk,wt,wi,we);b.append(grid);let save=el('button','btn primary','Criar template');save.onclick=async()=>{try{await api('/api/v1/templates',{method:'POST',body:JSON.stringify({name:name.value,kind:kind.value,target:target.value,interval_seconds:Number(interval.value)||30,timeout_seconds:5,expected_status:Number(expected.value)||200,enabled:true})});toast('Template salvo');await refresh()}catch(e){toast(e.message)}};b.append(save);$('content').append(c);let listed=card('Templates cadastrados',`${snapshot.templates.length} verificações`);let rows=snapshot.templates.map(t=>[t.name,t.kind,t.target,status(t.status),t.last_error||`${t.last_value.toFixed(0)} ms`,el('button','btn danger','Excluir')]);rows.forEach((row,i)=>{row[5].onclick=async()=>{if(!confirm('Excluir este template?'))return;await api('/api/v1/templates/'+encodeURIComponent(snapshot.templates[i].id),{method:'DELETE'});await refresh()}});body(listed).append(table(['Nome','Tipo','Alvo','Status','Último resultado','Ação'],rows));$('content').append(listed);$('content').append(el('div','notice','Por padrão, o servidor bloqueia consultas a IPs privados e locais. Para monitorar uma rede interna autorizada, configure OBSERVA_ALLOW_PRIVATE_TARGETS=true. SNMP, LLD, macros e herança de templates estão planejados, ainda não implementados.'))}
function sources(){let c=card('Adicionar fonte de dados','Prometheus ou JSON REST');let b=body(c),grid=el('div','grid2');let [wn,name]=field('Nome','text','Prometheus de produção');let [wk,kind]=selectField('Conector',[['prometheus','Prometheus instant query'],['json','REST JSON']]);let [wu,url]=field('URL','text','https://prometheus.exemplo.com');let [ws,secret]=field('Variável de ambiente com token','text','PROM_TOKEN (opcional)');grid.append(wn,wk,wu,ws);b.append(grid);let save=el('button','btn primary','Salvar conexão');save.onclick=async()=>{try{await api('/api/v1/datasources',{method:'POST',body:JSON.stringify({name:name.value,kind:kind.value,url:url.value,secret_env:secret.value})});toast('Data Source salva');await refresh()}catch(e){toast(e.message)}};b.append(save);$('content').append(c);let list=card('Fontes configuradas',`${snapshot.datasources.length} conectores`);body(list).append(table(['Nome','Tipo','URL'],snapshot.datasources.map(x=>[x.name,x.kind,x.url])));$('content').append(list);if(snapshot.datasources.length){let test=card('Testar consulta');let tb=body(test);let [wd,ds]=selectField('Data Source',snapshot.datasources.map(x=>[x.id,x.name]));let [wq,q]=field('Query (PromQL ou caminho JSON)','text','up ou $.status');let [wr,result]=field('Resultado','text','');result.readOnly=true;tb.append(wd,wq,wr);let testbtn=el('button','btn','Executar consulta');testbtn.onclick=async()=>{try{let r=await api('/api/v1/query?source='+encodeURIComponent(ds.value)+'&expr='+encodeURIComponent(q.value));result.value=r.text;toast('Consulta concluída')}catch(e){toast(e.message)}};tb.append(testbtn);$('content').append(test)}}
function dashboards(){let cardNew=card('Criar dashboard','Painéis customizados');let b=body(cardNew),[wn,title]=field('Título do dashboard','text','Visão operacional');let [wp,kind]=selectField('Primeiro painel',[['stat','Indicador'],['html','HTML Graphics']]);let [wh,html]=field('HTML do painel','textarea','<h1>Serviços</h1>');let [wc,css]=field('CSS do painel','textarea','body { background: #0d192a; color: white; }');let [wj,js]=field('JavaScript isolado','textarea','');let [ws,ds]=selectField('Data Source',[['','Dados internos'],...snapshot.datasources.map(x=>[x.id,x.name])]);let [wq,query]=field('Query','text','up ou status.online');b.append(wn,wp,wh,wc,wj,ws,wq);let add=el('button','btn primary','Criar dashboard');add.onclick=async()=>{try{await api('/api/v1/dashboards',{method:'POST',body:JSON.stringify({title:title.value,panels:[{id:'p1',title:kind.value==='html'?'HTML Graphics':'Indicador',kind:kind.value,source_id:ds.value,query:query.value,html:html.value,css:css.value,js:js.value}]})});toast('Dashboard salvo');await refresh()}catch(e){toast(e.message)}};b.append(add);$('content').append(cardNew);snapshot.dashboards.forEach(d=>{let c=card(d.title,`${d.panels.length} painéis`);let g=el('div','panel-list');g.style.padding='15px';d.panels.forEach(p=>{let pc=el('div','card preview-panel');pc.append(el('h2','',p.title));if(p.kind==='html'){let frame=el('iframe');frame.setAttribute('sandbox','allow-scripts');frame.setAttribute('referrerpolicy','no-referrer');let script=p.js.replace(/<\/script/gi,'<\\/script');frame.srcdoc='<!doctype html><html><head><meta charset="utf-8"><style>'+p.css+'</style></head><body>'+p.html+'<script>window.addEventListener("message",e=>{window.panelData=e.data});'+script+'<\/script></body></html>';pc.append(frame)}else{const val=el('div','value',p.source_id?'Consultando…':String(snapshot.service_map.nodes.filter(n=>n.kind==='service').length));pc.append(val);if(p.source_id)api('/api/v1/query?source='+encodeURIComponent(p.source_id)+'&expr='+encodeURIComponent(p.query)).then(r=>val.textContent=r.text).catch(e=>val.textContent='Indisponível')};g.append(pc)});c.append(g);$('content').append(c)});if(!snapshot.dashboards.length)$('content').append(el('div','notice','O Dashboard Builder inicial suporta indicadores e HTML Graphics com iframe sandbox. O editor de grid completo, gráficos históricos e importação Grafana são etapas futuras.'))}
function incidents(){let c=card('Histórico de incidentes',`${snapshot.events.length} registros`);let b=body(c);if(!snapshot.events.length)b.append(el('div','empty','Sem incidentes detectados. O motor atual registra falhas de templates e desaparecimento de serviços entre inventários.'));snapshot.events.slice().reverse().forEach(e=>{let x=el('div','incident');x.append(el('strong','',e.summary),el('div','meta',e.entity+' · '+new Date(e.at).toLocaleString('pt-BR')+' · '+e.status));(e.evidence||[]).forEach(v=>x.append(el('div','meta',v)));b.append(x)});$('content').append(c)}
function mcp(){let c=card('MCP Server','Ferramentas de análise, somente leitura');let b=body(c);b.append(el('div','notice','Endpoint: POST /mcp · JSON-RPC 2.0 · HTTP stateless. Autenticação: X-API-Key (token administrativo). Suporte básico de ferramentas MCP; compatibilidade com todos os clientes ainda não foi validada.'));b.append(el('p','sub','Ferramentas disponíveis: list_hosts, list_services, service_dependencies, network_flows, list_incidents.'));let p=el('pre','mono','{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}');p.style.whiteSpace='pre-wrap';b.append(p);$('content').append(c)}
$('connect').onclick=async()=>{token=$('token').value.trim();try{snapshot=await api('/api/v1/snapshot');sessionStorage.setItem('observa_admin_token',token);$('login').style.display='none';render()}catch(e){$('loginerror').textContent=e.message}};$('refresh').onclick=refresh;$('logout').onclick=()=>{sessionStorage.removeItem('observa_admin_token');token='';$('login').style.display='flex'};if(token)refresh();setInterval(()=>{if(token&&document.visibilityState==='visible')refresh()},30000);
</script></body></html>
