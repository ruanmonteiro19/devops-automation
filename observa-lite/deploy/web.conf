pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
    client_max_body_size 6m;
    location /api/ { proxy_pass http://vetra-server:8080; proxy_set_header Host $http_host; }
    location /v1/ { proxy_pass http://vetra-server:8080; proxy_set_header Host $http_host; }
    location = /mcp { proxy_pass http://vetra-server:8080; proxy_set_header Host $http_host; }
    location /rum/ { proxy_pass http://vetra-server:8080; proxy_set_header Host $http_host; }
    location = /healthz { proxy_pass http://vetra-server:8080; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
