name: Build Linux
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
  linux:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: mkdir -p dist && CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -trimpath -ldflags='-s -w' -o dist/observa-linux-${{ matrix.arch }} ./cmd/observa
      - uses: actions/upload-artifact@v4
        with:
          name: observa-linux-${{ matrix.arch }}
          path: dist/observa-linux-${{ matrix.arch }}
