# Example for a SINGLE NODE in a trusted lab only.
# Do not expose port 3100 externally without proper auth/TLS.
auth_enabled: false
analytics:
  reporting_enabled: false
server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
ingester:
  chunk_idle_period: 20m
  max_chunk_age: 1h
limits_config:
  retention_period: 168h
  max_query_lookback: 168h
  max_query_length: 24h
  max_entries_limit_per_query: 200
  ingestion_rate_mb: 2
  ingestion_burst_size_mb: 4
  max_line_size: 131072
  reject_old_samples: true
  reject_old_samples_max_age: 168h
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 20
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 10
  delete_request_store: filesystem
